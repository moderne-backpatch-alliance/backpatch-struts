  - cve: CVE-2025-68493
    upstream_fix_url: https://github.com/advisories/GHSA-qcfc-hmrc-59x7
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2025-68493
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-struts/commit/3575ad8
    basis: adapted
    artifacts:
      - org.apache.struts:struts2-core
      - org.apache.struts.xwork:xwork-core
    note: "New in this release; ported onto 2.3.37; fixed at 2.3.37.1-backpatch-00011 (backpatch-struts@3575ad8). Struts XSLT results now create their `TransformerFactory` with the JAXP 1.5 attributes `accessExternalDTD` and `accessExternalStylesheet` set to empty, and the parser for `struts.xml` and validation files no longer resolves external entities (CVE-2025-68493). If Xalan 2.7.2 or another factory without JAXP 1.5 support is on your classpath, every XSLT result fails with `IllegalArgumentException` (\"Not supported: http://javax.xml.XMLConstants/property/accessExternalDTD\"); a stylesheet that declares an external DTD fails to load; and external entities in your Struts XML files are no longer read. Use the JDK's factory, by removing Xalan or starting with `-Djavax.xml.transform.TransformerFactory=com.sun.org.apache.xalan.internal.xsltc.trax.TransformerFactoryImpl`, move DTD declarations into the stylesheet's internal subset, and replace entity includes in `struts.xml` with `<include file=\"...\"/>`. Overriding the new protected `XSLTResult.createTransformerFactory()` to leave the attributes out keeps another factory working, and brings back the exposure the fix closes."
