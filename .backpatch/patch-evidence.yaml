  - cve: CVE-2023-50164
    upstream_fix_url: https://github.com/advisories/GHSA-2j39-qcjm-428w
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2023-50164
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-struts/commit/c11299f
    basis: adapted
    artifacts:
      - org.apache.struts:struts2-core
      - org.apache.struts.xwork:xwork-core
    note: Carried from 2.3.37.1-backpatch-00008; ported onto 2.3.37; fixed at 2.3.37.1-backpatch-00008 (backpatch-struts@c11299f). Struts 2 applications that upload files through the fileUpload interceptor drop a request parameter whose name matches an upload field's name, or its FileName or ContentType parameter, ignoring case, before the interceptor sets the uploaded file's values (CVE-2023-50164). With the file field upload, a form field named UploadFileName or UPLOADCONTENTTYPE no longer reaches the action, so the action's file name and content type come only from the uploaded file.
  - cve: CVE-2024-53677
    upstream_fix_url: https://github.com/advisories/GHSA-43mq-6xmg-29vm
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2024-53677
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-struts/commit/a87ee7a
    basis: adapted
    artifacts:
      - org.apache.struts:struts2-core
      - org.apache.struts.xwork:xwork-core
    note: "Carried from 2.3.37.1-backpatch-00009; ported onto 2.3.37; fixed at 2.3.37.1-backpatch-00009 (backpatch-struts@a87ee7a). Struts 2 applications that upload files through the fileUpload interceptor drop every request parameter whose name contains an upload field's FileName or ContentType parameter name, ignoring case, before the interceptor sets that field's values (CVE-2024-53677). With the file field upload, form fields such as top.uploadFileName or uploadFileNameHint no longer reach the action. This also removes values the interceptor set itself for another upload field whose name ends in the first one's: with the upload fields file and myfile, myfileFileName and myfileContentType are lost when file is handled after myfile, which depends on the order of the multipart parts, so the action sees a null file name and content type for myfile."
