  - cve: CVE-2021-31805
    upstream_fix_url: https://github.com/apache/struts/commit/8d6e26e0feb8cb1669f45a66e458860534b94571
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2021-31805
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-struts/commit/7dc5958
    basis: adapted
    artifacts:
      - org.apache.struts:struts2-core
      - org.apache.struts.xwork:xwork-core
    note: "New in this release; ported onto 2.3.37; fixed at 2.3.37.1-backpatch-00004 (backpatch-struts@7dc5958). Struts tags now replace every character other than letters, digits and `_` with `_` when they build an element id from a field or action name, and evaluate a name that is itself an expression a second time only when the result passes Struts' accepted and excluded patterns (CVE-2021-31805). If your CSS or scripts address generated ids built from names with dashes or other punctuation, they stop matching: a textfield `user-name` in form `register` gets the id `register_user_name` where 2.3.37 gave `register_user-name`, and a form for the action `save-user` gets `save_user`. If a tag `name`, `<s:param>` name or stream result `inputName` is an expression whose result your app relies on being evaluated again and that result fails the patterns (a dash or quote is enough), the textfield shows the result as text, the param tag fails with \"Excluded or not accepted name found\", and the stream result cannot find its stream. Set an explicit `id` on the tag, which is used as given, or update the selectors; give the textfield a `value` attribute instead of relying on the second evaluation of `name`."
