  - cve: CVE-2021-31805
    upstream_fix_url: https://github.com/apache/struts/commit/8d6e26e0feb8cb1669f45a66e458860534b94571
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2021-31805
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-struts/commit/7dc5958
    basis: adapted
    artifacts:
      - org.apache.struts:struts2-core
      - org.apache.struts.xwork:xwork-core
    note: "Carried from 2.3.37.1-backpatch-00004; ported onto 2.3.37; fixed at 2.3.37.1-backpatch-00004 (backpatch-struts@7dc5958). Struts tags now replace every character other than letters, digits and `_` with `_` when they build an element id from a field or action name, and evaluate a name that is itself an expression a second time only when the result passes Struts' accepted and excluded patterns (CVE-2021-31805). If your CSS or scripts address generated ids built from names with dashes or other punctuation, they stop matching: a textfield `user-name` in form `register` gets the id `register_user_name` where 2.3.37 gave `register_user-name`, and a form for the action `save-user` gets `save_user`. If a tag `name`, `<s:param>` name or stream result `inputName` is an expression whose result your app relies on being evaluated again and that result fails the patterns (a dash or quote is enough), the textfield shows the result as text, the param tag fails with \"Excluded or not accepted name found\", and the stream result cannot find its stream. Set an explicit `id` on the tag, which is used as given, or update the selectors; give the textfield a `value` attribute instead of relying on the second evaluation of `name`."
  - cve: CVE-2023-34149
    upstream_fix_url: https://github.com/advisories/GHSA-8f6x-v685-g2xc
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2023-34149
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-struts/commit/3ba3a6d
    basis: adapted
    artifacts:
      - org.apache.struts:struts2-core
      - org.apache.struts.xwork:xwork-core
    note: Carried from 2.3.37.1-backpatch-00005; ported onto 2.3.37; fixed at 2.3.37.1-backpatch-00005 (backpatch-struts@3ba3a6d). Struts now refuses an OGNL list index above 255 when it would grow a list, and any index above 255 when it sets a list element (CVE-2023-34149). If your forms post list elements by index past 255, such as `users[300].name` on an action with a `List` named `users`, or `tags[300]=red` even when the list already holds that many elements, the parameter is not set and the value is missing from the action, with no error shown to the user. Raise the limit with `struts.ognl.autoGrowthCollectionLimit` (or the older `xwork.autoGrowCollectionLimit`) in `struts.xml` or `struts.properties`, to the largest index your forms post; a very large limit brings back the exposure the fix closes.
  - cve: CVE-2023-34396
    upstream_fix_url: https://github.com/advisories/GHSA-4g42-gqrg-4633
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2023-34396
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-struts/compare/65597b0~1...0734fa0
    basis: adapted
    artifacts:
      - org.apache.struts:struts2-core
      - org.apache.struts.xwork:xwork-core
    note: Carried from 2.3.37.1-backpatch-00006; ported onto 2.3.37; fixed at 2.3.37.1-backpatch-00006 (backpatch-struts@65597b0..0734fa0). Struts now refuses a normal (non-file) field longer than 4096 bytes in a multipart form post (CVE-2023-34396). If your upload forms carry long text, such as a 5000 character textarea, that field's value is dropped and the action gets the error 'The request parameter "comment" was too long...', so with the default stack the user is sent back to the `input` result; the limit counts bytes, so text outside ASCII reaches it sooner. Raise it with `struts.multipart.maxStringLength` to the longest field you accept; a very large value brings back the exposure the fix closes.
